version: '3.8'

# Production Docker Compose for AutoTest-Agent
# Optimized for domestic network environments (Chinese mirror registries)
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose build --no-cache   # Rebuild API image
#   docker compose logs -f api        # Tail API logs

services:
  # ===== PostgreSQL Database =====
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: autotest-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autotest}
      POSTGRES_USER: ${POSTGRES_USER:-autotest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autotest_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autotest} -d ${POSTGRES_DB:-autotest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - autotest-network

  # ===== Redis Cache / Message Broker =====
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: autotest-redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autotest-network

  # ===== AutoTest-Agent API Server =====
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: autotest-api
    image: ${API_IMAGE:-autotest-agent:latest}
    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-autotest}:${DB_PASSWORD:-autotest_pass}@postgres:5432/${POSTGRES_DB:-autotest}
      # Redis / Celery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # LLM
      - LLM_PROVIDERS=${LLM_PROVIDERS}
      # Server
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - DEBUG=${DEBUG:-false}
      # Docker Sandbox
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - DOCKER_MIRROR=${DOCKER_MIRROR:-registry.cn-hangzhou.aliyuncs.com}
      - SANDBOX_MAX_CPU=${SANDBOX_MAX_CPU:-2}
      - SANDBOX_MAX_MEMORY=${SANDBOX_MAX_MEMORY:-2g}
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-300}
      # Concurrency
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-10}
      # Package registries (domestic mirrors)
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
      # Security
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:-change-me-in-production}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - autotest-network

  # ===== Celery Worker =====
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotest-worker
    image: ${WORKER_IMAGE:-autotest-agent:latest}
    command: celery -A src.scheduler.celery_app worker --loglevel=${LOG_LEVEL:-info} --concurrency=${MAX_CONCURRENCY:-4}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-autotest}:${DB_PASSWORD:-autotest_pass}@postgres:5432/${POSTGRES_DB:-autotest}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_PROVIDERS=${LLM_PROVIDERS}
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - DOCKER_MIRROR=${DOCKER_MIRROR:-registry.cn-hangzhou.aliyuncs.com}
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: '${WORKER_CPU_LIMIT:-4}'
          memory: ${WORKER_MEMORY_LIMIT:-4g}
    networks:
      - autotest-network

volumes:
  postgres_data:
    name: autotest_postgres_data
    driver: local
  redis_data:
    name: autotest_redis_data
    driver: local
  app_data:
    name: autotest_app_data
    driver: local

networks:
  autotest-network:
    name: autotest_network
    driver: bridge