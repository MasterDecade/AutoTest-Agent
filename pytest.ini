[pytest]
# Pytest configuration for AutoTest-Agent

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires services)
    sandbox: Sandbox tests (requires Docker)
    slow: Slow running tests

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout (seconds)
timeout = 300
