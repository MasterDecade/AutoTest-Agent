version: '3.8'

# 开发环境 Docker Compose 配置
# 使用国内镜像源加速，适配中国大陆网络环境

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # 构建时传递镜像源参数
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: autotest-agent-dev
    hostname: dev-container
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      - DATABASE_URL=postgresql://autotest:autotest_dev@postgres:5432/autotest_dev
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      - NPM_CONFIG_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
      - DOCKER_MIRROR=${DOCKER_MIRROR:-registry.cn-hangzhou.aliyuncs.com}
    ports:
      - "8080:8080"   # FastAPI
      - "3000:3000"   # Frontend Dev Server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dev-network
    command: sleep infinity

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: autotest-dev-postgres
    environment:
      POSTGRES_DB: autotest_dev
      POSTGRES_USER: autotest
      POSTGRES_PASSWORD: autotest_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotest -d autotest_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: autotest-dev-redis
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

volumes:
  postgres_dev_data:
    name: autotest_dev_postgres_data
  redis_dev_data:
    name: autotest_dev_redis_data

networks:
  dev-network:
    name: autotest_dev_network
    driver: bridge